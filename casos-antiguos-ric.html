const age=f=>Math.round((SNAP-new Date(f+"T00:00:00"))/864e5);
const cls=d=>d>=100?"d-r":d>=30?"d-a":"d-g";
const fmt=f=>f.split("-").reverse().join("/");

Object.values(by).forEach(a=>a.sort((x,y)=>x[4].localeCompare(y[4])||x[0]-y[0]));

const open={};const TOP=5;
function rowsHtml(a){return `<div class="scroll"><table><thead><tr><th>Caso</th><th>Problema</th><th>Estado</th><th>Creado</th><th class="n">Antigüedad (d)</th><th class="n">Sin gestión (d)</th></tr></thead><tbody>`+

function render(){
  const v=sel.value;const list=v?[v]:names;
  const all=list.flatMap(n=>by[n]);

  document.getElementById("k").innerHTML=
    `<div class="k"><b>${all.length.toLocaleString("es")}</b><span>casos pendientes</span></div>`+
    `<div class="k"><b>${list.length}</b><span>asesor${list.length>1?"es":""}</span></div>`+
    `<div class="k"><b class="d-r">${age(oldest[4]).toLocaleString("es")} d</b><span>caso más antiguo (#${oldest[0]})</span></div>`+
    `<div class="k"><b>${all.filter(r=>age(r[4])>=100).length.toLocaleString("es")}</b><span>con 100 días o más</span></div>`;

      (!v&&a.length>TOP?`<div class="more">${full?"Mostrando todos · tocar el nombre para contraer":`Mostrando los ${TOP} más antiguos de ${a.length} · tocar el nombre para ver todos`}</div>`:"")+`</div>`}).join("");
  if(!v)document.querySelectorAll(".ah").forEach(h=>h.onclick=()=>{open[h.dataset.n]=!open[h.dataset.n];render()});
}
sel.onchange=render;render();
